services:
  app:
    build:
      context: .
      target: runtime
    ports:
      - "8050:8050"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      LLAMACPP_BASE_URL: ${LLAMACPP_BASE_URL:-http://host.docker.internal:8080/v1}
      LLAMACPP_API_KEY: ${LLAMACPP_API_KEY:-sk-no-key-required}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}

  test:
    build:
      context: .
      target: test
    command: pytest --cov --cov-report=term-missing

  llamacpp:
    image: ghcr.io/ggml-org/llama.cpp:server
    profiles: ["llm"]
    ports:
      - "8080:8080"
    volumes:
      - ./models:/models:ro
    command: ["-m", "/models/model.gguf", "--host", "0.0.0.0", "--port", "8080", "--embedding"]
