[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spin-rag"
version = "0.2.0"
description = "Typed, self-evolving knowledge-graph RAG for restoring damaged records."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "iblameandrew" }]
keywords = ["rag", "knowledge-graph", "llama.cpp", "restoration"]
dependencies = [
    "numpy>=1.23",
    "openai>=1.40",
]

[project.optional-dependencies]
app = [
    "dash>=2.14",
    "dash-bootstrap-components>=1.5",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
]

[project.urls]
Homepage = "https://github.com/iblameandrew/spin-rag"
Repository = "https://github.com/iblameandrew/spin-rag"

[tool.setuptools.packages.find]
include = ["spin_rag*"]
exclude = ["tests", "tests.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m \"not live\" --strict-markers"
markers = [
    "live: hits OpenRouter or a llama.cpp server",
]

[tool.coverage.run]
source = ["spin_rag"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["spin_rag", "tests", "demo.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["spin_rag", "tests"]
